services:
  nextjs:
    container_name: nextjs
    build:
      context: .
      dockerfile: ops/Dockerfile
    env_file:
      - .env.production
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    container_name: nginx
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - nextjs
    volumes:
      - ./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
