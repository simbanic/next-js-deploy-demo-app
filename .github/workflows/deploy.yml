name: Deploy to EKS (Build + Helm)

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 711039118774
  ECR_REPO: nextjs-app
  IMAGE_TAG: ${{ github.sha }}

  HELM_RELEASE: nextjs
  HELM_CHART_PATH: .ops/helm
  K8S_NAMESPACE: test-deploy

jobs:
  deploy:
    runs-on: demo-runners

    steps:
      # ------------------------------------------------------------
      # Checkout code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Install kubectl (ARM64)
      # ------------------------------------------------------------
      - name: Install kubectl (ARM64)
        run: |
          curl -LO https://dl.k8s.io/release/v1.29.0/bin/linux/arm64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      # ------------------------------------------------------------
      # Install Helm (ARM64)
      # ------------------------------------------------------------
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      # ------------------------------------------------------------
      # Verify Kubernetes access
      # ------------------------------------------------------------
      - name: Verify cluster access
        run: |
          kubectl get nodes
          kubectl get ns

      # ------------------------------------------------------------
      # Setup Docker Buildx (ARM64)
      # ------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------
      # Login to Amazon ECR
      # ------------------------------------------------------------
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
          | docker login \
              --username AWS \
              --password-stdin \
              $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      # ------------------------------------------------------------
      # Build & Push Next.js image (ARM64)
      # ------------------------------------------------------------
      - name: Build and push image
        run: |
          IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG

          docker buildx build \
            --platform linux/arm64 \
            -t $IMAGE_URI \
            --push \
            .

      # ------------------------------------------------------------
      # Deploy with Helm
      # ------------------------------------------------------------
      - name: Deploy with Helm
        run: |
          helm upgrade --install "$HELM_RELEASE" "$HELM_CHART_PATH" \
            -f "$HELM_CHART_PATH/values.dev.yml" \
            --set image.repository=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO \
            --set image.tag=$IMAGE_TAG \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --atomic \
            --timeout 5m
