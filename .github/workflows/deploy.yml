name: Deploy to EKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # REQUIRED for OIDC
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: demo-eks-cluster
  HELM_RELEASE: nextjs
  HELM_CHART_PATH: .ops/helm   # adjust if needed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - permissions:
          id-token: write
          contents: read

      # ------------------------------------------------------------
      # Configure AWS credentials via OIDC
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::711039118774:role/github-actions-eks
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------
      # Install kubectl
      # ------------------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      # ------------------------------------------------------------
      # Install Helm
      # ------------------------------------------------------------
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Verify assumed IAM role
        run: |
          aws sts get-caller-identity

      # ------------------------------------------------------------
      # Generate kubeconfig for EKS
      # ------------------------------------------------------------
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # ------------------------------------------------------------
      # Verify Kubernetes access (CRITICAL)
      # ------------------------------------------------------------
      - name: Verify cluster access
        run: |
          kubectl config current-context
          kubectl get nodes

      # ------------------------------------------------------------
      # Deploy using Helm
      # ------------------------------------------------------------
      - name: Deploy with Helm
        run: |
          helm upgrade --install "$HELM_RELEASE" "$HELM_CHART_PATH" \
            --atomic \
            --timeout 5m
