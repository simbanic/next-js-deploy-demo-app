name: Deploy to EKS (Helm only)

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: demo-eks-cluster
  HELM_RELEASE: nextjs
  HELM_CHART_PATH: .ops/helm
  K8S_NAMESPACE: test-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # AWS auth via OIDC
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::711039118774:role/github-actions-eks
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------
      # Verify AWS identity (CRITICAL)
      # ------------------------------------------------------------
      - name: Verify assumed IAM role
        run: aws sts get-caller-identity

      # ------------------------------------------------------------
      # Install kubectl
      # ------------------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      # ------------------------------------------------------------
      # Install Helm
      # ------------------------------------------------------------
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Debug EKS token generation
        run: |
          aws eks get-token \
            --region $AWS_REGION \
            --cluster-name $EKS_CLUSTER_NAME

      # ------------------------------------------------------------
      # Update kubeconfig
      # ------------------------------------------------------------
      - name: Update kubeconfig
        env:
          AWS_EKS_INTERACTIVE_MODE: never
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME

      # ------------------------------------------------------------
      # Verify Kubernetes access
      # ------------------------------------------------------------
      - name: Verify cluster access
        run: |
          kubectl get nodes

      # ------------------------------------------------------------
      # Helm deploy (NO IMAGE BUILD)
      # ------------------------------------------------------------
      - name: Deploy with Helm
        run: |
          helm upgrade --install "$HELM_RELEASE" "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --atomic \
            --timeout 5m
