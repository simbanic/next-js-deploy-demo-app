name: Deploy to EKS (Helm only)

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  HELM_RELEASE: nextjs
  HELM_CHART_PATH: ops/helm
  K8S_NAMESPACE: test-deploy

jobs:
  deploy:
    runs-on: demo-runners


    steps:
      # ------------------------------------------------------------
      # Checkout code 1
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl (ARM64)
        run: |
          curl -LO https://dl.k8s.io/release/v1.29.0/bin/linux/arm64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Install Helm (ARM64)
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      # ------------------------------------------------------------
      # Verify Kubernetes access (ARC runner already authenticated)
      # ------------------------------------------------------------
      - name: Verify cluster access
        run: |
          kubectl get nodes
          kubectl get ns

      # ------------------------------------------------------------
      # Deploy with Helm
      # ------------------------------------------------------------
      - name: Deploy with Helm
        run: |
          helm upgrade --install "$HELM_RELEASE" "$HELM_CHART_PATH" \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --atomic \
            --timeout 5m
