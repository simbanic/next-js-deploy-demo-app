name: Deploy to EKS (Kaniko + Helm)

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: 711039118774
  ECR_REPO: nextjs-app
  IMAGE_TAG: ${{ github.sha }}

  HELM_RELEASE: nextjs
  HELM_CHART_PATH: .ops/helm
  K8S_NAMESPACE: test-deploy

jobs:
  deploy:
    runs-on: demo-runners

    steps:
      # ------------------------------------------------------------
      # Checkout code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Install kubectl (ARM64)
      # ------------------------------------------------------------
      - name: Install kubectl (ARM64)
        run: |
          curl -LO https://dl.k8s.io/release/v1.29.0/bin/linux/arm64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      # ------------------------------------------------------------
      # Install Helm
      # ------------------------------------------------------------
      - name: Install Helm
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          helm version

      # ------------------------------------------------------------
      # Verify Kubernetes access
      # ------------------------------------------------------------
      - name: Verify cluster access
        run: |
          kubectl get nodes
          kubectl get ns

      # ------------------------------------------------------------
      # Build & Push image with Kaniko
      # ------------------------------------------------------------
      - name: Build & Push image (Kaniko)
        run: |
          IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG
          WORKSPACE=/home/runner/_work/${{ github.repository }}/$(basename ${{ github.repository }})

          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: kaniko-build
            namespace: $K8S_NAMESPACE
          spec:
            restartPolicy: Never
            serviceAccountName: demo-runners-gha-rs-no-permission
            containers:
              - name: kaniko
                image: gcr.io/kaniko-project/executor:v1.23.2
                args:
                  - "--dockerfile=Dockerfile"
                  - "--context=dir:///workspace"
                  - "--destination=$IMAGE_URI"
                  - "--verbosity=info"
                env:
                  - name: AWS_REGION
                    value: "$AWS_REGION"
                volumeMounts:
                  - name: workspace
                    mountPath: /workspace
            volumes:
              - name: workspace
                hostPath:
                  path: $WORKSPACE
                  type: Directory
          EOF

          kubectl wait \
            --for=condition=Ready \
            pod/kaniko-build \
            -n $K8S_NAMESPACE \
            --timeout=10m

          kubectl logs -n $K8S_NAMESPACE kaniko-build

      # ------------------------------------------------------------
      # Deploy with Helm
      # ------------------------------------------------------------
      - name: Deploy with Helm
        run: |
          helm upgrade --install "$HELM_RELEASE" "$HELM_CHART_PATH" \
            -f "$HELM_CHART_PATH/values.dev.yml" \
            --set image.repository=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO \
            --set image.tag=$IMAGE_TAG \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --atomic \
            --timeout 5m
